name: CI

on:
  push:
    branches: [main, deepseek]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Runtime information
        run: |
          node --version
          node -p "require('./server/package.json').engines.node"
      - name: Syntax checks
        run: |
          for file in server/*.mjs server/src/*.mjs docker/*.mjs scripts/*.mjs; do
            [ -e "$file" ] || continue
            node --check "$file"
          done
      - name: Full regression suite (zero dependencies)
        run: node --test --test-reporter=spec server/test/*.test.mjs

  zero-deps:
    name: Zero dependency verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: No declared runtime or development dependencies
        working-directory: server
        run: |
          node -e 'const p=require("./package.json");if(Object.keys(p.dependencies||{}).length||Object.keys(p.devDependencies||{}).length)process.exit(1)'
      - name: No node_modules or lockfiles committed
        run: |
          for path in node_modules server/node_modules package-lock.json server/package-lock.json yarn.lock server/yarn.lock pnpm-lock.yaml server/pnpm-lock.yaml; do
            if [ -e "$path" ]; then echo "::error::$path must not be committed"; exit 1; fi
          done
      - name: All source modules import without installation
        working-directory: server
        run: |
          node --input-type=module -e 'import{readdirSync}from"node:fs";for(const f of readdirSync("src").filter(f=>f.endsWith(".mjs")))await import("./src/"+f)'

  container-test:
    name: Container acceptance (${{ matrix.arch }})
    needs: [test, zero-deps]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build native image
        run: docker build --tag workbuddy-openai-proxy:ci .
      - name: Isolated ports, console login, persistence and SIGINT checks
        env:
          IMAGE_REF: workbuddy-openai-proxy:ci
          TARGET_PLATFORM: linux/${{ matrix.arch }}
        run: node scripts/docker-smoke.mjs

  publish:
    name: Publish multi-architecture image
    needs: [test, zero-deps, container-test]
    if: >-
      github.repository == 'wttwins/hermes-workbuddy-integration' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image and commit/version tags
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="${image}:sha-${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=$'\n'"${image}:latest"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Unsupported version tag'; exit 1; }
            tags+=$'\n'"${image}:${version}"
          fi
          {
            echo "name=$image"
            echo 'tags<<IMAGE_TAGS'
            echo "$tags"
            echo 'IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=workbuddy-multiarch
          cache-to: type=gha,mode=max,scope=workbuddy-multiarch
          provenance: mode=max
          sbom: true
      - name: Verify published index architectures
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          INDEX_FILE: ${{ runner.temp }}/workbuddy-index.json
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > "$INDEX_FILE"
          python3 -c 'import json,os;d=json.load(open(os.environ["INDEX_FILE"]));a={m.get("platform",{}).get("architecture") for m in d.get("manifests",[]) if m.get("platform",{}).get("os")=="linux"};assert {"amd64","arm64"}.issubset(a),a;print("Published architectures:",sorted(a))'
          echo "Published $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
